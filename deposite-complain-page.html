<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complain Page | TopX Help Center</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1f2430;--muted:#6b7280;--border:#e5e7eb;--shadow:0 8px 30px rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#0c111e;--card:#1c1f28;--text:#eceef3;--muted:#9aa1b2;--border:#2a2e3a;--shadow:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}header{background:var(--card);border-bottom:1px solid var(--border)}.nav{max-width:960px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);text-decoration:none}.brand img{height:34px;width:auto}.logo-dark{display:none}[data-theme=dark] .logo-dark{display:block}[data-theme=dark] .logo-light{display:none}button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;cursor:pointer;font:inherit}main{max-width:752px;margin:auto;padding:32px 16px 48px}.back{color:var(--muted);text-decoration:none;font-size:.9rem}.back:hover{text-decoration:underline}h1{font-size:2rem;line-height:1.2;margin:24px 0 8px}.intro{color:var(--muted);margin:0 0 24px}.content{background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:28px}section+section{border-top:1px solid var(--border);margin-top:24px;padding-top:24px}h2{font-size:1.15rem;line-height:1.35;margin:0 0 10px}p{margin:0 0 12px}p:last-child{margin-bottom:0}ul,ol{padding-left:22px;margin:8px 0 12px}li{margin:6px 0}a{color:#d62705}.notice{border-left:3px solid #ff2a00;background:var(--bg);padding:14px 16px;margin-bottom:28px;font-size:.9rem;border-radius:3px}footer{border-top:1px solid var(--border);background:var(--card);padding:20px 16px;text-align:center;color:var(--muted);font-size:.85rem}@media(max-width:600px){.content{padding:20px}h1{font-size:1.6rem}}

    /* Subtle page entrance; respect reduced-motion preferences. */
    @keyframes pageEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: no-preference) { main { animation: pageEnter 320ms ease-out both; } }
label{display:block;font-weight:600;margin-bottom:6px;font-size:.92rem}.field{margin-bottom:16px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}.field input:focus,.field select:focus{outline:2px solid #ff2a00;border-color:#ff2a00}.hint{font-size:.82rem;color:var(--muted);margin-top:6px}.btn-submit{width:100%;padding:13px;font-weight:700;border:0;border-radius:6px;background:#ff2a00;color:#fff;box-shadow:0 0 15px rgba(255,42,0,.45);cursor:pointer;font:inherit}.btn-submit:hover{opacity:.9;transform:translateY(-1px)}.form-dialog{margin:auto;width:min(90%,360px);padding:24px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);text-align:center}.form-dialog::backdrop{background:rgba(0,0,0,.6)}

/* Deposit complaint form */
body { min-height: 100vh; display: flex; flex-direction: column; }
header { box-shadow: 0 4px 20px rgba(0,0,0,.035); }
.nav { min-height: 68px; }
.brand { gap: 12px; letter-spacing: -.02em; }
#themeToggle { width: 42px; height: 42px; display: grid; place-items: center; font-size: 1.2rem; }
main { width: 100%; max-width: 640px; flex: 1; padding: 36px 16px 56px; }
.back { display: inline-flex; align-items: center; padding: 4px 0; font-weight: 600; transition: color .2s; }
.back:hover { color: #ff2a00; text-decoration: none; }
h1 { font-size: clamp(1.55rem, 4vw, 2rem); letter-spacing: -.035em; margin: 25px 0 22px; }
.content { padding: 32px; border-radius: 12px; box-shadow: var(--shadow); }
#depositForm { display: grid; gap: 20px; }
.field { margin: 0; }
label { margin-bottom: 8px; font-size: .88rem; letter-spacing: .01em; }
.field input, .field select { min-height: 50px; padding: 12px 14px; border-radius: 8px; transition: border-color .2s, box-shadow .2s; }
.field input:hover, .field select:hover { border-color: #a3a8b3; }
.field input:focus, .field select:focus { outline: 0; border-color: #ff2a00; box-shadow: 0 0 0 3px rgba(255,42,0,.15); }
.field select { cursor: pointer; }
.field input[type=file] { padding: 8px; cursor: pointer; font-size: .87rem; }
.field input[type=file]::file-selector-button { border: 0; border-radius: 6px; background: var(--card); color: var(--text); padding: 8px 12px; margin-right: 12px; cursor: pointer; font: inherit; font-weight: 600; }
.hint { line-height: 1.5; margin: 7px 0 0; }
.btn-submit { min-height: 52px; border-radius: 8px; font-weight: 700; margin-top: 4px; transition: transform .2s, opacity .2s, box-shadow .2s; }
.btn-submit:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #ff2a00; outline-offset: 3px; }
.form-dialog { border-radius: 12px; box-shadow: var(--shadow); }
footer { margin-top: auto; }
@media (max-width:600px) { main { padding-top: 26px; } .content { padding: 22px; } #depositForm { gap: 18px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; } }
/* Keep each field title inside its input card. */
.field { position: relative; }
.field label { position: absolute; top: 9px; left: 15px; right: auto; z-index: 1; margin: 0; text-align: left; font-size: .72rem; line-height: 1.2; color: var(--muted); pointer-events: none; }
.field input, .field select { min-height: 64px; padding: 26px 14px 9px; }
.field input[type=file] { min-height: 76px; padding: 29px 8px 8px; }
/* Empty text fields show their label vertically centered on the left. */
.field label { transition: top .2s, transform .2s, font-size .2s; }
.field:has(input:not([type=file]):placeholder-shown:not(:focus)) label,
.field:has(select:invalid:not(:focus)) label { top: 50%; transform: translateY(-50%); font-size: .9rem; }
.field select:invalid { color: transparent; }
.field select option { color: var(--text); background: var(--card); }
</style></head><body><header><div class="nav"><a class="brand" href="index.html"><img class="logo-light" src="logo/logo.png" alt="TopX"><img class="logo-dark" src="logo/logo-dark.png" alt="TopX"><span>Help Center</span></a></div></header><main><a class="back" href="index.html">← Back to Help Center</a><h1>Deposit Complain Page</h1><div class="content"><section><form id="depositForm" novalidate>
<div class="field"><label for="username">User Name</label><input placeholder=" " id="username" name="username" type="text" autocomplete="username" required></div>
<div class="field"><label for="mobile">Mobile Number</label><input placeholder=" " id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="numeric" required></div>
<div class="field"><label for="email">Email ID</label><input placeholder=" " id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Set Password</label><input placeholder=" " id="password" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
<div class="field"><label for="problem">Select Problem</label><select id="problem" name="problem" required><option value="" selected disabled>—</option><option value="processing">Processing</option><option value="pending">Pending</option><option value="failed">Failed</option><option value="not-received">Not Received in Account</option></select></div>
<div class="field"><label for="paymentImage">Upload Payment Image</label><input id="paymentImage" name="paymentImage" type="file" accept="image/*" required></div>
<button class="btn-submit" type="submit">Submit Now</button>
</form></section></div><dialog id="formDialog" class="form-dialog" aria-labelledby="formDialogTitle"><h2 id="formDialogTitle">Coming Soon</h2><p>Submission will be available soon.</p><form method="dialog"><button type="submit">Close</button></form></dialog></main><footer>© <span id="year"></span> TopX Support Center. All rights reserved.</footer><script>document.getElementById('depositForm').addEventListener('submit',function(e){e.preventDefault();if(!this.checkValidity()){this.reportValidity();return;}document.getElementById('formDialog').showModal();});document.getElementById('year').textContent=new Date().getFullYear();</script></body></html>
