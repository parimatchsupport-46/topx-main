<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}header{background:var(--card);border-bottom:1px solid var(--border)}.nav{max-width:960px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);text-decoration:none}.brand img{height:34px;width:auto}.logo-dark{display:none}[data-theme=dark] .logo-dark{display:block}[data-theme=dark] .logo-light{display:none}button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;cursor:pointer;font:inherit}main{max-width:752px;margin:auto;padding:32px 16px 48px}.back{color:var(--muted);text-decoration:none;font-size:.9rem}.back:hover{text-decoration:underline}h1{font-size:2rem;line-height:1.2;margin:24px 0 8px}.intro{color:var(--muted);margin:0 0 24px}.content{background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:28px}section+section{border-top:1px solid var(--border);margin-top:24px;padding-top:24px}h2{font-size:1.15rem;line-height:1.35;margin:0 0 10px}p{margin:0 0 12px}p:last-child{margin-bottom:0}ul,ol{padding-left:22px;margin:8px 0 12px}li{margin:6px 0}a{color:#d62705}.notice{border-left:3px solid #ff2a00;background:var(--bg);padding:14px 16px;margin-bottom:28px;font-size:.9rem;border-radius:3px}footer{border-top:1px solid var(--border);background:var(--card);padding:20px 16px;text-align:center;color:var(--muted);font-size:.85rem}@media(max-width:600px){.content{padding:20px}h1{font-size:1.6rem}}

    /* Subtle page entrance; respect reduced-motion preferences. */
    @keyframes pageEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: no-preference) { main { animation: pageEnter 320ms ease-out both; } }
label{display:block;font-weight:600;margin-bottom:6px;font-size:.92rem}.field{margin-bottom:16px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font:inherit}.field input:focus,.field select:focus{outline:2px solid #ff2a00;border-color:#ff2a00}.hint{font-size:.82rem;color:var(--muted);margin-top:6px}.btn-submit{width:100%;padding:13px;font-weight:700;border:0;border-radius:6px;background:#ff2a00;color:#fff;box-shadow:0 0 15px rgba(255,42,0,.45);cursor:pointer;font:inherit}.btn-submit:hover{opacity:.9;transform:translateY(-1px)}.form-dialog{margin:auto;width:min(90%,360px);padding:24px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);text-align:center}.form-dialog::backdrop{background:rgba(0,0,0,.6)}

/* Deposit complaint form */
body { min-height: 100vh; display: flex; flex-direction: column; }
header { box-shadow: 0 4px 20px rgba(0,0,0,.035); }
.nav { min-height: 68px; }
.brand { gap: 12px; letter-spacing: -.02em; }
main { width: 100%; max-width: 640px; flex: 1; padding: 36px 16px 56px; }
.back { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); transition: color .2s, border-color .2s, transform .2s; }
.back:hover { color: #ff2a00; border-color: #ff2a00; transform: translateX(-2px); text-decoration: none; }
h1 { font-size: clamp(1.55rem, 4vw, 2rem); letter-spacing: -.035em; margin: 0 0 24px; text-align: center; }
.content { margin-top: 24px; padding: 32px; border-radius: 12px; box-shadow: var(--shadow); }
#depositForm { display: grid; gap: 20px; }
.field { margin: 0; }
label { margin-bottom: 8px; font-size: .88rem; letter-spacing: .01em; }
.field input, .field select { min-height: 50px; padding: 12px 14px; border-radius: 8px; transition: border-color .2s, box-shadow .2s; }
.field input:hover, .field select:hover { border-color: #a3a8b3; }
.field input:focus, .field select:focus { outline: 0; border-color: #ff2a00; box-shadow: 0 0 0 3px rgba(255,42,0,.15); }
.field select { cursor: pointer; }
.field input[type=file] { padding: 8px; cursor: pointer; font-size: .87rem; }
.field input[type=file]::file-selector-button { border: 0; border-radius: 6px; background: var(--card); color: var(--text); padding: 8px 12px; margin-right: 12px; cursor: pointer; font: inherit; font-weight: 600; }
.hint { line-height: 1.5; margin: 7px 0 0; }
.btn-submit { min-height: 52px; border-radius: 8px; font-weight: 700; margin-top: 4px; transition: transform .2s, opacity .2s, box-shadow .2s; }
.btn-submit:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #ff2a00; outline-offset: 3px; }
.form-dialog { border-radius: 12px; box-shadow: var(--shadow); }
footer { margin-top: auto; }
@media (max-width:600px) { main { padding-top: 26px; } .content { padding: 22px; } #depositForm { gap: 18px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; } }
/* Visible labels remain above fields; placeholders sit inside. */
.field input::placeholder { color: var(--muted); opacity: 1; }
.field select:invalid { color: var(--muted); }
.field select option { color: var(--text); background: var(--card); }
.field input[type=file].has-file { border-color: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,.25); color: #22c55e; }
.btn-submit:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }

    /* Navbar and drawer (same as index) */
    .navbar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); transition: background 0.3s, border-color 0.3s; }
    .nav-inner { max-width: 960px; margin: 0 auto; height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .logo img { height: 28px; width: auto; display: block; }
    .logo span { font-weight: 700; font-size: 1rem; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { width: 42px; height: 42px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, background 0.3s; }
    .icon-btn:hover { transform: scale(1.08); }
    .icon-btn svg { width: 20px; height: 20px; }

    .menu-dialog { position: fixed; inset: 0 auto 0 0; margin: 0; width: min(320px, 85vw); max-width: none; height: 100dvh; max-height: none; padding: 24px; border: 0; border-right: 1px solid var(--border); background: var(--card); color: var(--text); box-shadow: var(--shadow); overflow-y: auto; }
    .menu-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
    .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .menu-header h2 { font-size: 1.2rem; }
    .menu-links { display: flex; flex-direction: column; gap: 4px; }
    .menu-links a { color: var(--text); text-decoration: none; padding: 12px; border-radius: 6px; }
    .menu-links a:hover, .menu-links a:focus-visible { background: var(--bg); color: var(--accent); }
    .menu-theme { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    @keyframes menuEnter { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes backdropEnter { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) {
      .menu-dialog[open] { animation: menuEnter 250ms ease-out both; }
      .menu-dialog[open]::backdrop { animation: backdropEnter 250ms ease-out both; }
    }

  </style><link rel="stylesheet" href="fonts/fonts.css">
</head><body><header class="navbar"><div class="nav-inner"><a href="index.html" class="logo"><img class="logo-light" src="logo/logo.png" alt="TopX"><img class="logo-dark" src="logo/logo-dark.png" alt="TopX"><span>Help Center</span></a><div class="nav-actions"><button class="icon-btn" id="menuOpen" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="menuDialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div></div></header><main><a class="back" href="index.html" aria-label="Back to Help Center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><div class="content"><h1>Deposit Complain Page</h1><section><form id="depositForm" novalidate>
<div class="field"><label for="username">User Name</label><input placeholder="User Name" id="username" name="username" type="text" autocomplete="username" required></div>
<div class="field"><label for="mobile">Mobile Number</label><input placeholder="Mobile Number" id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="numeric" required></div>
<div class="field"><label for="email">Email ID</label><input placeholder="Email ID" id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="problem">Select Problem</label><select id="problem" name="problem" required><option value="" selected disabled>Select Problem</option><option value="processing">Processing</option><option value="pending">Pending</option><option value="failed">Failed</option><option value="not-received">Not Received in Account</option></select></div>

<button class="btn-submit" type="submit" disabled>Submit Now</button>
</form></section></div><dialog id="formDialog" class="form-dialog" aria-labelledby="formDialogTitle"><h2 id="formDialogTitle">Coming Soon</h2><p>Submission will be available soon.</p><form method="dialog"><button type="submit">Close</button></form></dialog></main><footer>© <span id="year"></span> TopX Support Center. All rights reserved.</footer>  <dialog id="menuDialog" class="menu-dialog" aria-labelledby="menuTitle">
    <div class="menu-header"><h2 id="menuTitle">Menu</h2><form method="dialog"><button type="submit" class="icon-btn" aria-label="Close menu">✕</button></form></div>
    <nav class="menu-links" aria-label="Main menu">
      <a href="index.html">Home</a>
      <a href="faq.html">FAQ</a>

      <a href="live-chat-complain-page.html">Live Chat</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="cookies.html">Cookies</a>
    </nav>
    <div class="menu-theme"><span>Light / Dark Mode</span>
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </dialog>
<script>document.getElementById('depositForm').addEventListener('submit',function(e){e.preventDefault();if(!this.checkValidity()){this.reportValidity();return;}document.getElementById('formDialog').showModal();});const depositForm=document.getElementById('depositForm'),submitBtn=depositForm.querySelector('.btn-submit'),fileInput=document.getElementById('paymentImage');function refreshForm(){fileInput.classList.toggle('has-file',fileInput.files.length>0);submitBtn.disabled=!depositForm.checkValidity();}depositForm.addEventListener('input',refreshForm);depositForm.addEventListener('change',refreshForm);refreshForm();document.getElementById('year').textContent=new Date().getFullYear();
    const menuOpen = document.getElementById("menuOpen");
    const menuDialog = document.getElementById("menuDialog");
    menuOpen.addEventListener("click", () => menuDialog.showModal());
    menuDialog.addEventListener("close", () => menuOpen.focus());
    menuDialog.addEventListener("click", (event) => {
      if (event.target === menuDialog) {
        const rect = menuDialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) menuDialog.close();
      }
    });
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    function setTheme(theme) { root.setAttribute("data-theme", theme); try { localStorage.setItem("theme", theme); } catch (e) {} }
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    setTheme(saved || "dark");
    toggle.addEventListener("click", () => { setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });
</script>
